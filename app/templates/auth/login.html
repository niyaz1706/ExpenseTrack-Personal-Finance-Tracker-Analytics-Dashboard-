{% extends "base.html" %}

{% block title %}Login - ExpenseTrack{% endblock %}

{% block content %}
<div class="row justify-content-center pt-5">
    <div class="col-12 col-sm-8 col-md-6 col-lg-4">
        <div class="card shadow p-4">
            <div class="text-center mb-4">
                <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width: 56px; height: 56px;">
                    <i class="bi bi-wallet2 fs-2"></i>
                </div>
                <h3 class="fw-bold">Welcome Back</h3>
                <p class="text-muted">Sign in to manage your finances</p>
            </div>

            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="mb-3">
                    <label for="identifier" class="form-label">Username or Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="identifier" name="identifier" value="{{ identifier or '' }}" required autofocus placeholder="username or email">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
                    </div>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="remember" name="remember">
                    <label class="form-check-label" for="remember">Remember me</label>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign In</button>
            </form>

            <div class="text-center mt-4">
                <p class="text-muted mb-0">Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-decoration-none fw-semibold">Register</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
